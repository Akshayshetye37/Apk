
name: Build Aurelia PMS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'aurelia-pms-flutter-apk-source.zip'
      - '.github/workflows/**'
      - 'assets/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'scripts/**'
      - 'android/**'
      - 'README.md'
      - 'CHECKLIST.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          mkdir -p project
          unzip -o aurelia-pms-flutter-apk-source.zip -d project
          echo "Extracted files:"
          find project -maxdepth 4 -type f | head -100

      - name: Locate Flutter project
        run: |
          FILE=$(find project -name pubspec.yaml -print -quit)
          if [ -z "$FILE" ]; then
            echo "ERROR: pubspec.yaml was not found in the ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Install the latest supplied PMS HTML
        run: |
          if [ ! -f assets/index.html ]; then
            echo "ERROR: assets/index.html is missing from the repository."
            exit 1
          fi
          mkdir -p "$PROJECT_DIR/assets"
          cp assets/index.html "$PROJECT_DIR/assets/index.html"
          if [ -f lib/main.dart ]; then cp lib/main.dart "$PROJECT_DIR/lib/main.dart"; fi
          if [ -f pubspec.yaml ]; then cp pubspec.yaml "$PROJECT_DIR/pubspec.yaml"; fi
          echo "Installed repository HTML, Flutter wrapper, and dependencies into the app."

      - name: Apply Android WebView API compatibility fix
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sed -i '/platformController\.setDomStorageEnabled(true);/d' lib/main.dart
          sed -i '/platformController\.setJavaScriptCanOpenWindowsAutomatically(true);/d' lib/main.dart
          if grep -Eq 'setDomStorageEnabled|setJavaScriptCanOpenWindowsAutomatically' lib/main.dart; then
            echo "ERROR: unsupported AndroidWebViewController calls remain."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter create . --platforms=android

      - name: Apply committed Android project configuration
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/android/app/build.gradle.kts"
          cp -a "$GITHUB_WORKSPACE/android/." "$PROJECT_DIR/android/"
          echo "Committed Android configuration copied into the build project."

      - name: Harden Android network, backup, and release configuration
        run: python3 "$GITHUB_WORKSPACE/scripts/harden_android.py" "$PROJECT_DIR"

      - name: Run static security checks
        run: python3 scripts/security_static_check.py

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Prepare release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            KEY_PATH="$GITHUB_WORKSPACE/$PROJECT_DIR/android/app/release-keystore.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEY_PATH"
            echo "ANDROID_KEYSTORE_PATH=$KEY_PATH" >> "$GITHUB_ENV"
            echo "Release signing keystore configured."
          else
            echo "::warning::Release keystore secrets are missing. APK will use the temporary debug key and is not suitable for production distribution or future signed updates."
          fi

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Verify APK signature
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -n1)/apksigner" verify --verbose "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-pms-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
