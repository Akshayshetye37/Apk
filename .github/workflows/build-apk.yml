
name: Build Aurelia PMS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'aurelia-pms-flutter-apk-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          mkdir -p project
          unzip -o aurelia-pms-flutter-apk-source.zip -d project
          echo "Extracted files:"
          find project -maxdepth 4 -type f | head -100

      - name: Locate Flutter project
        run: |
          FILE=$(find project -name pubspec.yaml -print -quit)
          if [ -z "$FILE" ]; then
            echo "ERROR: pubspec.yaml was not found in the ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Install the latest supplied PMS HTML
        run: |
          if [ ! -f assets/index.html ]; then
            echo "ERROR: assets/index.html is missing from the repository."
            exit 1
          fi
          mkdir -p "$PROJECT_DIR/assets"
          cp assets/index.html "$PROJECT_DIR/assets/index.html"
          if [ -f lib/main.dart ]; then cp lib/main.dart "$PROJECT_DIR/lib/main.dart"; fi
          if [ -f pubspec.yaml ]; then cp pubspec.yaml "$PROJECT_DIR/pubspec.yaml"; fi
          echo "Installed repository HTML, Flutter wrapper, and dependencies into the app."

      - name: Apply Android WebView API compatibility fix
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sed -i '/platformController\.setDomStorageEnabled(true);/d' lib/main.dart
          sed -i '/platformController\.setJavaScriptCanOpenWindowsAutomatically(true);/d' lib/main.dart
          if grep -Eq 'setDomStorageEnabled|setJavaScriptCanOpenWindowsAutomatically' lib/main.dart; then
            echo "ERROR: unsupported AndroidWebViewController calls remain."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter create . --platforms=android

      - name: Harden Android network and backup policy
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="false">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          XML
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit(f"ERROR: expected manifest not found: {manifest}")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(manifest)
          root = tree.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")
          if app is None:
              raise SystemExit("ERROR: Android manifest has no application element")
          app.set(ns + "usesCleartextTraffic", "false")
          app.set(ns + "networkSecurityConfig", "@xml/network_security_config")
          app.set(ns + "allowBackup", "false")
          app.set(ns + "fullBackupContent", "false")
          app.set(ns + "dataExtractionRules", "@xml/data_extraction_rules")
          rules = Path("android/app/src/main/res/xml/data_extraction_rules.xml")
          rules.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
                  <exclude domain="root" path="." />
                  <exclude domain="file" path="." />
                  <exclude domain="database" path="." />
                  <exclude domain="sharedpref" path="." />
                  <exclude domain="external" path="." />
              </cloud-backup>
              <device-transfer>
                  <exclude domain="root" path="." />
                  <exclude domain="file" path="." />
                  <exclude domain="database" path="." />
                  <exclude domain="sharedpref" path="." />
                  <exclude domain="external" path="." />
              </device-transfer>
          </data-extraction-rules>
          """, encoding="utf-8")
          ET.indent(tree, space="    ")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          print("Applied HTTPS-only network policy and disabled Android backup/transfer.")
          PY

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-pms-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
