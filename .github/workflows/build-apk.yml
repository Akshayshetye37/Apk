name: Build Aurelia PMS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'assets/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'scripts/**'
      - 'android/**'
      - 'README.md'
      - 'CHECKLIST.md'

permissions:
  contents: read

concurrency:
  group: aurelia-production-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Signing secrets are only used for trusted pushes/manual runs on this repository's main branch.
    if: github.repository == 'Akshayshetye37/Apk' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select authoritative Flutter project
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f assets/index.html
          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "Building directly from the committed repository source."

      - name: Apply Android WebView API compatibility fix
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          sed -i '/platformController\.setDomStorageEnabled(true);/d' lib/main.dart
          sed -i '/platformController\.setJavaScriptCanOpenWindowsAutomatically(true);/d' lib/main.dart
          if grep -Eq 'setDomStorageEnabled|setJavaScriptCanOpenWindowsAutomatically' lib/main.dart; then
            echo "ERROR: unsupported AndroidWebViewController calls remain."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          cache: true

      - name: Prepare Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter create . --platforms=android

      - name: Verify Android project configuration
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/android/app/build.gradle.kts"
          echo "Using the Android project configuration in the checkout; no self-copy is needed."

      - name: Remove generated placeholder widget test
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then
            rm -f test/widget_test.dart
          fi

      - name: Harden Android network, backup, and release configuration
        run: python3 "$GITHUB_WORKSPACE/scripts/harden_android.py" "$PROJECT_DIR"

      - name: Run static security checks
        run: python3 scripts/security_static_check.py

      - name: Resolve dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          flutter pub get
          test -f pubspec.lock

      - name: Analyze and test
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          flutter analyze --fatal-infos
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo "No Flutter test files are present; skipping the test runner."
          fi

      - name: Prepare release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'ERROR: Required repository signing secret(s) missing or empty: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          umask 077
          KEY_PATH="$RUNNER_TEMP/aurelia-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jks"
          cleanup() { rm -f "$KEY_PATH"; }
          trap cleanup EXIT
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEY_PATH"; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is not valid Base64." >&2
            exit 1
          fi
          chmod 600 "$KEY_PATH"
          if [[ ! -s "$KEY_PATH" ]] || ! keytool -list -keystore "$KEY_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "ERROR: Decoded keystore is unreadable or the configured password/alias is invalid." >&2
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          # Preserve the validated file for the Gradle build; the always() cleanup step removes it.
          trap - EXIT
          KEY_CERT=$(keytool -list -v -keystore "$KEY_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | awk -F': ' '/SHA256:/ {print toupper($2); exit}')
          EXPECTED_CERT="3B:EE:A1:E6:FF:13:C7:50:E7:D2:13:00:82:29:AF:38:15:3F:A8:32:8D:A9:C1:A2:48:13:4D:D6:93:3D:4A:36"
          if [[ -z "$KEY_CERT" ]]; then
            echo "ERROR: Could not extract SHA-256 fingerprint from configured keystore alias." >&2
            exit 1
          fi
          echo "Configured keystore alias SHA-256 fingerprint: $KEY_CERT"
          if [[ "$KEY_CERT" != "$EXPECTED_CERT" ]]; then
            echo "ERROR: Configured keystore does not match the intended aurelia-release-new.jks certificate. Check ANDROID_KEYSTORE_BASE64 and ANDROID_KEY_ALIAS secrets." >&2
            exit 1
          fi
          echo "Configured keystore matches the intended Aurelia release certificate."

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -s "$ANDROID_KEYSTORE_PATH"
          flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Sign APK with configured production keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -n1)"
          # Sign explicitly with the configured production key so generated Gradle
          # defaults cannot silently leave the artifact signed by a different key.
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RUNNER_TEMP/aurelia-release-signed.apk" \
            "$APK"
          mv "$RUNNER_TEMP/aurelia-release-signed.apk" "$APK"

      - name: Verify APK signature against configured production keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/apk-certs.txt"
          keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > "$RUNNER_TEMP/keystore-cert.txt"
          APK_CERT=$(awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print tolower($2); exit}' "$RUNNER_TEMP/apk-certs.txt" | tr -d ':')
          KEY_CERT=$(awk -F': ' '/SHA256:/ {print tolower($2); exit}' "$RUNNER_TEMP/keystore-cert.txt" | tr -d ':')
          EXPECTED_CERT="3bee a1e6ff13c750e7d213008229af38153fa8328da9c1a248134dd6933d4a36".replace(/ /g, "")
          echo "Actual APK signer SHA-256 fingerprint: $APK_CERT"
          echo "Expected release SHA-256 fingerprint: $EXPECTED_CERT"
          if [[ -z "$APK_CERT" || -z "$KEY_CERT" || "$APK_CERT" != "$EXPECTED_CERT" || "$KEY_CERT" != "$EXPECTED_CERT" ]]; then
            echo "ERROR: APK signer, configured keystore, or intended release fingerprint do not match." >&2
            exit 1
          fi
          echo "APK signature is valid and its certificate matches the configured production keystore."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-pms-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Clean up temporary signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_KEYSTORE_PATH:-}" ]]; then rm -f "$ANDROID_KEYSTORE_PATH"; fi
          rm -f "$RUNNER_TEMP/apk-certs.txt" "$RUNNER_TEMP/keystore-cert.txt"
          echo "Temporary signing files removed."
