name: Build Aurelia PMS APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'
      - 'assets/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'scripts/**'
      - 'android/**'
      - 'README.md'
      - 'CHECKLIST.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select authoritative Flutter project
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f assets/index.html
          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "Building directly from the committed repository source."

      - name: Apply Android WebView API compatibility fix
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sed -i '/platformController\.setDomStorageEnabled(true);/d' lib/main.dart
          sed -i '/platformController\.setJavaScriptCanOpenWindowsAutomatically(true);/d' lib/main.dart
          if grep -Eq 'setDomStorageEnabled|setJavaScriptCanOpenWindowsAutomatically' lib/main.dart; then
            echo "ERROR: unsupported AndroidWebViewController calls remain."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          cache: true

      - name: Prepare Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter create . --platforms=android

      - name: Verify Android project configuration
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/android/app/build.gradle.kts"
          echo "Using the Android project configuration in the checkout; no self-copy is needed."

      - name: Remove generated placeholder widget test
        run: |
          set -euo pipefail
          # flutter create generates a demo test that references MyApp, which this WebView app does not define.
          # Preserve any real test tracked in source control.
          if ! git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then
            rm -f test/widget_test.dart
          fi

      - name: Harden Android network, backup, and release configuration
        run: python3 "$GITHUB_WORKSPACE/scripts/harden_android.py" "$PROJECT_DIR"

      - name: Run static security checks
        run: python3 scripts/security_static_check.py

      - name: Resolve dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          flutter pub get
          test -f pubspec.lock

      - name: Analyze and test
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          flutter analyze --fatal-infos
          flutter test

      - name: Prepare release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            KEY_PATH="$PROJECT_DIR/android/app/release-keystore.jks"
            umask 077
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEY_PATH"
            test -s "$KEY_PATH"
            keytool -list -keystore "$KEY_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
            echo "ANDROID_KEYSTORE_PATH=$KEY_PATH" >> "$GITHUB_ENV"
            echo "Release signing keystore and alias validated."
          else
            echo "ERROR: Production signing secrets are missing. Refusing to produce a release APK with a debug key."
            exit 1
          fi

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Verify APK signature
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -n1)/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -n1)/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/apk-certs.txt"
          keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > "$RUNNER_TEMP/keystore-cert.txt"
          APK_CERT=$(awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print tolower($2); exit}' "$RUNNER_TEMP/apk-certs.txt" | tr -d ':')
          KEY_CERT=$(awk -F': ' '/SHA256:/ {print tolower($2); exit}' "$RUNNER_TEMP/keystore-cert.txt" | tr -d ':')
          test -n "$APK_CERT" && test -n "$KEY_CERT" && test "$APK_CERT" = "$KEY_CERT"
          echo "APK certificate matches configured production keystore."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-pms-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
