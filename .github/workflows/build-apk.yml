name: Aurelia PMS — Build Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aurelia-production-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          cache: true
      - name: Prepare Android platform
        run: flutter create . --platforms=android
      - name: Apply Android security hardening
        run: python scripts/harden_android.py "$GITHUB_WORKSPACE"
      - name: Inject reliability patches and check JavaScript syntax
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('assets/index.html')
          text = html.read_text(encoding='utf-8')
          patches = [('scripts/interaction_reliability.js', 'aurelia-interaction-reliability-patch'), ('scripts/file_viewing.js', 'aurelia-file-viewing-patch')]
          for source_path, patch_id in patches:
              source = Path(source_path).read_text(encoding='utf-8')
              tag = '<script id="' + patch_id + '">\\n' + source + '\\n</script>'
              if 'id="' + patch_id + '"' not in text:
                  pos = text.lower().rfind('</body>')
                  if pos < 0:
                      raise SystemExit('Could not locate </body> in assets/index.html')
                  text = text[:pos] + tag + text[pos:]
          html.write_text(text, encoding='utf-8')
          scripts = re.findall(r'<script\\b[^>]*>(.*?)</script\\s*>', text, re.I | re.S)
          for index, script in enumerate(scripts):
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8') as js:
                  js.write(script)
                  js.flush()
                  result = subprocess.run(['node', '--check', js.name], capture_output=True, text=True)
                  if result.returncode:
                      print(result.stderr)
                      raise SystemExit('Inline JavaScript syntax check failed for script ' + str(index))
          print('Validated ' + str(len(scripts)) + ' inline JavaScript blocks.')
          PY
      - name: Resolve and capture pinned Flutter dependencies
        run: |
          set -euo pipefail
          flutter pub get
          test -s pubspec.lock
      - name: Upload generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: generated-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 7
      - name: Remove generated placeholder widget test
        run: |
          if ! git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then
            rm -f test/widget_test.dart
          fi
      - name: Analyze Flutter source
        run: flutter analyze --fatal-infos
      - name: Run Flutter tests
        run: flutter test
      - name: Run static security checks
        run: python scripts/security_static_check.py
      - name: Run backup import regression tests
        run: node --test tests/backup_import.test.js
      - name: Build unsigned debug APK for Android compatibility
        run: flutter build apk --debug
      - name: Upload debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-pms-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  build:
    # Signing secrets are only used for trusted pushes/manual runs on this repository's main branch.
    if: github.repository == 'Akshayshetye37/Apk' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select authoritative Flutter project
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f assets/index.html
          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "Building directly from the committed repository source."

      - name: Inject PMS interaction reliability patch
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          test -s scripts/interaction_reliability.js
          python3 - <<'PY'
          from pathlib import Path
          html = Path('assets/index.html')
          text = html.read_text(encoding='utf-8')
          patches = [('scripts/interaction_reliability.js', 'aurelia-interaction-reliability-patch'), ('scripts/file_viewing.js', 'aurelia-file-viewing-patch')]
          for source_path, patch_id in patches:
              source = Path(source_path).read_text(encoding='utf-8')
              tag = '<script id="' + patch_id + '">\n' + source + '\n</script>'
              if 'id="' + patch_id + '"' not in text:
                  pos = text.lower().rfind('</body>')
                  if pos < 0:
                      raise SystemExit('Could not locate </body> in assets/index.html')
                  text = text[:pos] + tag + text[pos:]
          html.write_text(text, encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text = Path('assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script\b[^>]*>(.*?)</script\s*>', text, re.I | re.S)
          for index, script in enumerate(scripts):
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8') as f:
                  f.write(script); f.flush()
                  result = subprocess.run(['node', '--check', f.name], capture_output=True, text=True)
                  if result.returncode:
                      print(result.stderr)
                      raise SystemExit(f'Inline JavaScript syntax check failed for script {index}')
          print(f'Validated {len(scripts)} inline JavaScript blocks.')
          PY

      - name: Apply Android WebView API compatibility fix
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          sed -i '/platformController\.setDomStorageEnabled(true);/d' lib/main.dart
          sed -i '/platformController\.setJavaScriptCanOpenWindowsAutomatically(true);/d' lib/main.dart
          if grep -Eq 'setDomStorageEnabled|setJavaScriptCanOpenWindowsAutomatically' lib/main.dart; then
            echo "ERROR: unsupported AndroidWebViewController calls remain."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          cache: true

      - name: Prepare Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter create . --platforms=android

      - name: Verify Android project configuration
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/android/app/build.gradle.kts"
          echo "Using the Android project configuration in the checkout; no self-copy is needed."

      - name: Remove generated placeholder widget test
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then
            rm -f test/widget_test.dart
          fi

      - name: Harden Android network, backup, and release configuration
        run: python3 "$GITHUB_WORKSPACE/scripts/harden_android.py" "$PROJECT_DIR"

      - name: Run static security checks
        run: python3 scripts/security_static_check.py

      - name: Run backup import regression tests
        run: node --test tests/backup_import.test.js

      - name: Resolve dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          flutter pub get
          test -f pubspec.lock

      - name: Analyze and test
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          flutter analyze --fatal-infos
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo "No Flutter test files are present; skipping the test runner."
          fi

      - name: Prepare release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'ERROR: Required repository signing secret(s) missing or empty: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          umask 077
          KEY_PATH="$RUNNER_TEMP/aurelia-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jks"
          cleanup() { rm -f "$KEY_PATH"; }
          trap cleanup EXIT
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEY_PATH"; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is not valid Base64." >&2
            exit 1
          fi
          chmod 600 "$KEY_PATH"
          if [[ ! -s "$KEY_PATH" ]] || ! keytool -list -keystore "$KEY_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "ERROR: Decoded keystore is unreadable or the configured password/alias is invalid." >&2
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          # Preserve the validated file for the Gradle build; the always() cleanup step removes it.
          trap - EXIT
          KEY_CERT=$(keytool -list -v -keystore "$KEY_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | awk -F': ' '/SHA256:/ {print toupper($2); exit}')
          EXPECTED_CERT="3B:EE:A1:E6:FF:13:C7:50:E7:D2:13:00:82:29:AF:38:15:3F:A8:32:8D:A9:C1:A2:48:13:4D:D6:93:3D:4A:36"
          if [[ -z "$KEY_CERT" ]]; then
            echo "ERROR: Could not extract SHA-256 fingerprint from configured keystore alias." >&2
            exit 1
          fi
          echo "Configured keystore alias SHA-256 fingerprint: $KEY_CERT"
          if [[ "$KEY_CERT" != "$EXPECTED_CERT" ]]; then
            echo "ERROR: Configured keystore does not match the intended aurelia-release-new.jks certificate. Check ANDROID_KEYSTORE_BASE64 and ANDROID_KEY_ALIAS secrets." >&2
            exit 1
          fi
          echo "Configured keystore matches the intended Aurelia release certificate."

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -s "$ANDROID_KEYSTORE_PATH"
          flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Sign APK with configured production keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -n1)"
          # Sign explicitly with the configured production key so generated Gradle
          # defaults cannot silently leave the artifact signed by a different key.
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RUNNER_TEMP/aurelia-release-signed.apk" \
            "$APK"
          mv "$RUNNER_TEMP/aurelia-release-signed.apk" "$APK"

      - name: Verify APK signature against configured production keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK_PATH"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -n1)"

          # Verify the APK signature separately; failure stops the workflow.
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK_PATH"

          # Capture the certificate report. Newer Android Build Tools can label
          # signer records as "V2 Signer:" / "V3.0 Signer:" instead of "Signer #1".
          if ! "$BUILD_TOOLS/apksigner" verify --print-certs --verbose "$APK_PATH" > "$RUNNER_TEMP/apk-certs.txt" 2>&1; then
            echo "ERROR: apksigner failed while reporting APK signer certificates." >&2
            exit 1
          fi
          if ! keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > "$RUNNER_TEMP/keystore-cert.txt" 2>&1; then
            echo "ERROR: Could not read the configured keystore certificate." >&2
            exit 1
          fi

          # Match the digest label independent of signer-label format, then
          # extract everything after "certificate SHA-256 digest:".
          APK_CERT_RAW=$(sed -nE '/certificate[[:space:]]+SHA-256[[:space:]]+digest[[:space:]]*:/I { s/.*digest[[:space:]]*:[[:space:]]*//I; p; q; }' "$RUNNER_TEMP/apk-certs.txt")
          KEY_CERT_RAW=$(sed -nE '/SHA256[[:space:]]*:/I { s/^[^:]*:[[:space:]]*//; p; q; }' "$RUNNER_TEMP/keystore-cert.txt")
          EXPECTED_CERT_RAW="3B:EE:A1:E6:FF:13:C7:50:E7:D2:13:00:82:29:AF:38:15:3F:A8:32:8D:A9:C1:A2:48:13:4D:D6:93:3D:4A:36"

          normalize_fingerprint() {
            printf '%s' "$1" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]'
          }
          APK_CERT=$(normalize_fingerprint "$APK_CERT_RAW")
          KEY_CERT=$(normalize_fingerprint "$KEY_CERT_RAW")
          EXPECTED_CERT=$(normalize_fingerprint "$EXPECTED_CERT_RAW")

          if [[ -z "$APK_CERT" ]]; then
            echo "ERROR: Could not extract APK signer SHA-256 digest from apksigner --print-certs --verbose output." >&2
            echo "Certificate report labels found:" >&2
            grep -iE 'certificate.*SHA-256.*digest:' "$RUNNER_TEMP/apk-certs.txt" >&2 || true
            exit 1
          fi
          if [[ -z "$KEY_CERT" ]]; then
            echo "ERROR: Could not extract SHA-256 fingerprint from the configured keystore alias." >&2
            exit 1
          fi
          if [[ -z "$EXPECTED_CERT" ]]; then
            echo "ERROR: Expected production release SHA-256 fingerprint is empty." >&2
            exit 1
          fi

          echo "Actual APK signer SHA-256 fingerprint: $APK_CERT"
          echo "Configured keystore SHA-256 fingerprint: $KEY_CERT"
          echo "Expected release SHA-256 fingerprint: $EXPECTED_CERT"
          if [[ "$APK_CERT" != "$KEY_CERT" || "$APK_CERT" != "$EXPECTED_CERT" || "$KEY_CERT" != "$EXPECTED_CERT" ]]; then
            echo "ERROR: APK signer, configured keystore, and intended release fingerprints must all match." >&2
            exit 1
          fi
          echo "APK signature is valid and all three SHA-256 fingerprints match."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-pms-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Clean up temporary signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_KEYSTORE_PATH:-}" ]]; then rm -f "$ANDROID_KEYSTORE_PATH"; fi
          rm -f "$RUNNER_TEMP/apk-certs.txt" "$RUNNER_TEMP/keystore-cert.txt"
          echo "Temporary signing files removed."
