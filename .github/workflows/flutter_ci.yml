name: Aurelia PMS CI Verification

on:
  push:
    branches: ["main", "fix/*"]
  pull_request:
    branches: ["main"]

# CI validates untrusted pull-request code but never needs repository write access.
permissions:
  contents: read

concurrency:
  group: aurelia-flutter-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # For pull requests, checkout the merge ref from the base repository.
          # This avoids running fork-controlled workflow code with a write token.
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          cache: true

      - name: Resolve and validate Flutter dependency lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s pubspec.lock ]]; then
            echo "::warning::pubspec.lock is empty; resolving dependencies to allow analysis and regression tests to run. Commit the generated lockfile to make future builds reproducible."
            flutter pub get
          fi
          test -s pubspec.lock
          flutter pub get --enforce-lockfile
          echo "Dependency lockfile is internally consistent."

      - name: Prepare Android project with hardened configuration
        run: |
          set -euo pipefail
          flutter create . --platforms=android
          python3 scripts/harden_android.py "$GITHUB_WORKSPACE"
          python3 scripts/install_pdf_engine.py "$GITHUB_WORKSPACE"

      - name: Remove generated placeholder widget test
        run: |
          if ! git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then
            rm -f test/widget_test.dart
          fi

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('assets/index.html').read_text(encoding='utf-8')
          script_blocks = re.findall(r'<script\\b[^>]*>(.*?)</script\\s*>', html, re.I | re.S)
          for path in ('scripts/interaction_reliability.js', 'scripts/file_viewing.js'):
              script_blocks.append(Path(path).read_text(encoding='utf-8'))
          for index, script in enumerate(script_blocks):
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8') as f:
                  f.write(script)
                  f.flush()
                  result = subprocess.run(['node', '--check', f.name], capture_output=True, text=True)
                  if result.returncode:
                      print(result.stderr)
                      raise SystemExit(f'JavaScript syntax check failed for block {index}')
          print(f'Validated {len(script_blocks)} JavaScript blocks.')
          PY

      - name: Analyze Flutter source
        run: flutter analyze --fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Run static security checks
        run: python3 scripts/security_static_check.py

      - name: Run backup import regression tests
        run: node --test tests/backup_import.test.js
      - name: Run Indian ID OCR parser regression tests
        run: node --test tests/identity_parser.test.js

      - name: Run guest identity regression tests
        run: node --test tests/guest_identity.test.js
      - name: Run bundled PMS UI regression tests
        run: node --test tests/pms_ui.test.js
