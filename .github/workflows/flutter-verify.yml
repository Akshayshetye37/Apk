name: Flutter verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify injected JavaScript syntax
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script\\b[^>]*>(.*?)</script\\s*>', html, re.I | re.S)
          scripts.extend(Path(p).read_text(encoding='utf-8') for p in [
              'scripts/interaction_reliability.js',
              'scripts/file_viewing.js',
              'scripts/native_migration_bridge.js',
          ])
          for i, script in enumerate(scripts):
              if not script.strip(): continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8') as f:
                  f.write(script); f.flush()
                  result = subprocess.run(['node', '--check', f.name], capture_output=True, text=True)
                  if result.returncode:
                      print(result.stderr)
                      raise SystemExit(f'JavaScript syntax check failed at block {i}')
          print(f'JavaScript syntax validated for {len(scripts)} blocks.')
          PY
      - name: Test native migration bridge offline
        run: node scripts/test_native_migration_bridge.js
      - name: Resolve dependencies
        run: flutter pub get
      - name: Require committed reproducible lockfile
        run: |
          if ! git ls-files --error-unmatch pubspec.lock >/dev/null 2>&1; then
            echo 'pubspec.lock is missing from version control; automatic bootstrap was unavailable.' >&2
            exit 1
          fi
          if ! git diff --exit-code -- pubspec.lock; then
            echo 'pubspec.lock changed during dependency resolution; regenerate and commit it with Flutter 3.35.5.' >&2
            exit 1
          fi
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: |
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo 'No Dart tests present yet; Flutter analysis remains mandatory.'
          fi

  build-debug-apk:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          cache: true
      - name: Build debug APK
        run: |
          flutter pub get
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: aurelia-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
