name: Bootstrap committed Flutter lockfile

on:
  push:
    branches:
      - security/production-release-gate
    paths:
      - '.github/workflows/bootstrap-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true
      - name: Generate and print lockfile for review
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get
          test -s pubspec.lock
          sha256sum pubspec.lock
          echo 'LOCKFILE_CONTENT_BEGIN'
          cat pubspec.lock
          echo 'LOCKFILE_CONTENT_END'
