name: One-time lockfile recovery
on:
  push:
    branches:
      - fix/secure-storage-release-check
permissions:
  contents: write
jobs:
  recover:
    if: github.event.head_commit.message != 'chore: recover generated lockfile [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
      - name: Generate lockfile from committed pubspec
        run: flutter pub get
      - name: Commit only the resolved lockfile
        run: |
          test -s pubspec.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "chore: recover generated lockfile [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
