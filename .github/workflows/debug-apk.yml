name: Aurelia PMS Android debug build
on:
  push:
    branches:
      - fix/native-ocr-rebuild
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aurelia-debug-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          cache: true
      - name: Prepare Android platform
        run: flutter create . --platforms=android
      - name: Install PDF engine
        run: python3 scripts/install_pdf_engine.py "$GITHUB_WORKSPACE"
      - name: Inject HTML patches and validate JavaScript
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('assets/index.html')
          text = html.read_text(encoding='utf-8')
          patches = [
              ('scripts/interaction_reliability.js', 'aurelia-interaction-reliability-patch'),
              ('scripts/file_viewing.js', 'aurelia-file-viewing-patch'),
          ]
          for source_path, patch_id in patches:
              source = Path(source_path).read_text(encoding='utf-8')
              tag = '<script id="' + patch_id + '">\n' + source + '\n</script>'
              if 'id="' + patch_id + '"' not in text:
                  pos = text.lower().rfind('</body>')
                  if pos < 0: raise SystemExit('Could not locate </body> in assets/index.html')
                  text = text[:pos] + tag + text[pos:]
          html.write_text(text, encoding='utf-8')
          scripts = re.findall(r'<script\b[^>]*>(.*?)</script\s*>', text, re.I | re.S)
          for index, script in enumerate(scripts):
              if not script.strip(): continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8') as f:
                  f.write(script); f.flush()
                  result = subprocess.run(['node', '--check', f.name], capture_output=True, text=True)
                  if result.returncode:
                      print(result.stderr)
                      raise SystemExit('Inline JavaScript syntax check failed for script ' + str(index))
          print('Validated ' + str(len(scripts)) + ' inline JavaScript blocks.')
          PY
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Remove generated placeholder widget test
        run: |
          if ! git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then
            rm -f test/widget_test.dart
          fi
      - name: Analyze Flutter source
        run: flutter analyze --fatal-infos
      - name: Run backup import regression tests
        run: node --test tests/backup_import.test.js
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-pms-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
