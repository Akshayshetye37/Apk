name: aurelia_pms
description: Aurelia PMS Android WebView wrapper for the supplied HTML application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: 4.10.0
  webview_flutter_android: 4.3.0
  file_picker: 8.1.7
  open_filex: 4.7.0
  html: 0.15.5
  pdf: 3.11.3
  flutter_secure_storage: 9.2.4
  cryptography: 2.7.0
  local_auth: 2.3.0
  path_provider: 2.1.5
  qr: 3.0.2
  share_plus: 10.1.4
  google_mlkit_text_recognition: 0.15.0
  image: 4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/index.html
